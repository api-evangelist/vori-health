aid: vori-health
name: Vori Health
description: >-
  Vori Health is a nationwide, virtual-first musculoskeletal (MSK) medical practice
  headquartered in Nashville, Tennessee and founded in 2020 by neurosurgeon Dr. Ryan Grant
  (co-founder and CEO) and orthopedic surgeon Dr. Mary O'Connor (co-founder and Chief Medical
  Officer), formerly chair of orthopedics at Mayo Clinic in Florida. It treats back, neck and
  joint pain through physician-led, integrated care teams that pair board-certified
  physiatrists licensed in all 50 states with physical therapists, registered dietitians and
  health coaches, delivered virtually and in person through a patient mobile and web
  application, and sold to employers, health plans, benefits consultants and risk-bearing
  provider groups as a value-based alternative to surgery-first MSK care. The company raised a
  $53M Series B led by NEA with AlleyCorp, Intermountain Ventures, Echo Health Ventures and Max
  Ventures participating, and partners with payers and enablers including Humana, Pearl Health,
  Allstate Benefits, Marpai, Contigo Health, WholeHealth Living, Firefly Health and Ophelia.
